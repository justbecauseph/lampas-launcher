name: Validate and Build Launcher Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package:win
          - os: ubuntu-latest
            script: package:linux
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Install pinned Electron binary
        run: node node_modules/electron/install.js
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Test exact artifact-producing commit
        run: bun test
      - name: Audit dependencies
        run: bun audit
      - name: Package without publishing
        timeout-minutes: 20
        run: bun run ${{ matrix.script }}
      # Unsigned on purpose: the Microsoft Store signs the package during certification.
      - name: Package Microsoft Store AppX
        if: runner.os == 'Windows'
        timeout-minutes: 20
        run: bun run package:appx
      - name: Verify packaged fuses
        run: node scripts/verify-fuses.cjs
      - name: Configure Linux sandbox helpers
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox release/linux-unpacked/chrome-sandbox
      - name: Windows packaged smoke
        if: runner.os == 'Windows'
        run: bun test/smoke/electron-smoke.ts --strict
      - name: Linux packaged smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a bun test/smoke/electron-smoke.ts --strict
      - name: Generate SBOM and artifact checksums
        run: bun run security:artifacts
      - name: Windows packaged module workflow and repair restart
        if: runner.os == 'Windows'
        run: node node_modules/electron/cli.js test/smoke/packaged-workflow.cjs --asar=release/win-unpacked/resources/app.asar "--user-data-dir=$env:RUNNER_TEMP/lampas-packaged-workflow-ci"
      - name: Linux packaged module workflow and repair restart
        if: runner.os == 'Linux'
        run: xvfb-run -a node node_modules/electron/cli.js test/smoke/packaged-workflow.cjs --asar=release/linux-unpacked/resources/app.asar --user-data-dir="$RUNNER_TEMP/lampas-packaged-workflow-ci" --password-store=basic
      # Windows signing is optional; restore signature verification when certificate custody is ready.
      - name: Upload verified build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: launcher-${{ matrix.os }}-${{ github.sha }}
          path: |
            release/*.exe
            release/*.appx
            release/*.AppImage
            release/*.tar.gz
            release/*.cdx.json
            release/SHA256SUMS-*.txt
          if-no-files-found: error
          # Tag builds keep the Windows AppX for 90 days so a manual Store publish can use it later.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows-latest' && 90 || 7 }}

  release:
    name: Verify and publish release artifacts
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download artifacts from this run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Verify checksums
        working-directory: release-artifacts
        run: sha256sum --check SHA256SUMS-*.txt
      - name: Attest build provenance
        if: github.event.repository.private == false || vars.ENABLE_ARTIFACT_ATTESTATIONS == 'true'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            release-artifacts/*.exe
            release-artifacts/*.AppImage
            release-artifacts/*.tar.gz
            release-artifacts/*.cdx.json
            release-artifacts/SHA256SUMS-*.txt
      - name: Report unavailable GitHub artifact attestation
        if: github.event.repository.private == true && vars.ENABLE_ARTIFACT_ATTESTATIONS != 'true'
        run: echo "No GitHub artifact attestation is generated for this private repository. The release includes the commit and dependency inventory in its SBOM and artifact hashes in SHA256SUMS."
      - name: Create GitHub release
        id: release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release-artifacts/*.exe
            release-artifacts/*.AppImage
            release-artifacts/*.tar.gz
            release-artifacts/*.cdx.json
            release-artifacts/SHA256SUMS-*.txt
          generate_release_notes: true
      # Discord problems never fail the release: a missing webhook is a warning, and a failed post is ignored.
      - name: Notify Discord
        id: notify
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "::warning title=Discord notification skipped::DISCORD_WEBHOOK_URL is not set."
            exit 0
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          payload="$RUNNER_TEMP/discord-release.json"
          # generate_release_notes stores GitHub's generated notes in the release body.
          gh release view "$TAG" --repo "$REPO" --json body --jq '.body // ""' > "$notes" || : > "$notes"
          # Direct download links for the Windows installer and the Linux builds, taken from the published assets.
          assets="$RUNNER_TEMP/release-assets.json"
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets' > "$assets" || echo '[]' > "$assets"
          jq -n \
            --rawfile notes "$notes" \
            --slurpfile assets "$assets" \
            --arg tag "$TAG" \
            --arg url "$RELEASE_URL" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '
            (if ($notes | length) == 0 then "Release notes: see the release page."
             elif ($notes | length) > 1500 then $notes[0:1500] + "..."
             else $notes end) as $body
            | "Microsoft Store: submission is checked after this release publishes (skipped if a submission is still in certification)." as $store_line
            | ($assets[0] // []) as $files
            | ([
                ($files[] | select(.name | test("^LampasLauncher-Setup-.*\\.exe$")) | "Windows installer: [" + .name + "](" + .url + ")"),
                ($files[] | select(.name | test("-Linux\\.AppImage$")) | "Linux AppImage: [" + .name + "](" + .url + ")"),
                ($files[] | select(.name | test("-Linux\\.tar\\.gz$")) | "Linux tar.gz: [" + .name + "](" + .url + ")")
              ] | join("\n")) as $downloads
            | (if $downloads == "" then "" else "**Downloads**\n" + $downloads + "\n\n" end) as $downloads_block
            | {
                username: "Releases",
                embeds: [{
                  title: ("Lampas Launcher " + $tag + " released"),
                  url: $url,
                  color: 3066959,
                  description: ("Tag: " + $tag + "\n" + $store_line + "\n\n" + $downloads_block + $body),
                  footer: { text: "Lampas Launcher releases" },
                  timestamp: $timestamp
                }]
              }
            ' > "$payload"
          curl -fsS --max-time 30 -H 'Content-Type: application/json' --data "@$payload" "$DISCORD_WEBHOOK_URL"

  store:
    name: Submit to Microsoft Store
    needs: release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    # Shared with the manual publish in store-status.yml, so two Store submissions never overlap.
    concurrency:
      group: microsoft-store-submission
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # The preflight script lives in this repository, so check out the tagged commit to get it.
      - name: Checkout exact tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download Windows artifacts from this run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: launcher-windows-latest-${{ github.sha }}
          path: release-artifacts
      - name: Verify checksums
        working-directory: release-artifacts
        shell: bash
        run: sha256sum --check SHA256SUMS-*.txt
      - name: Setup Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.3
      # Credentials, msstore sign-in, pending submissions, and the Store version. A skip is not a failure:
      # the release stays published, and the Discord notice gives the reason.
      - name: Check Store submission preflight
        id: preflight
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          ARTIFACT_DIR: release-artifacts
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: bash .github/scripts/store-preflight.sh
      # Replaces any pending draft submission with a new one that carries this package.
      - name: Publish AppX submission
        id: publish
        if: steps.preflight.outputs.decision == 'submit'
        run: |
          $appx = Get-ChildItem release-artifacts -Filter *.appx | Select-Object -First 1
          if (-not $appx) { throw "No .appx artifact found" }
          # msstore only accepts .msix/.msixbundle/.msixupload; AppX and MSIX share the package format.
          $msix = Join-Path $env:RUNNER_TEMP ($appx.BaseName + ".msix")
          Copy-Item $appx.FullName $msix
          msstore publish $msix -id 9P9WWSV7L7RS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Ordered after the publish step and before the success notice: failure() is true only when an earlier step
      # failed, so a skipped or soft-failing notice never triggers this one.
      - name: Notify Discord of Store submission failure
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "::warning title=Discord notification skipped::DISCORD_WEBHOOK_URL is not set."
            exit 0
          fi
          payload=$(mktemp)
          jq -n \
            --arg tag "$TAG" \
            --arg run_url "$RUN_URL" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              username: "Releases",
              embeds: [{
                title: ("Lampas Launcher " + $tag + " Microsoft Store submission failed"),
                url: $run_url,
                color: 15158332,
                description: "A step in the store job failed, so the AppX was not confirmed as submitted. Open the run log, and check Partner Center for a partial submission before retrying.",
                footer: { text: "Microsoft Store submission" },
                timestamp: $timestamp
              }]
            }' > "$payload"
          curl -fsS --max-time 30 -H 'Content-Type: application/json' --data "@$payload" "$DISCORD_WEBHOOK_URL"
      - name: Notify Discord of Store submission
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "::warning title=Discord notification skipped::DISCORD_WEBHOOK_URL is not set."
            exit 0
          fi
          payload=$(mktemp)
          jq -n \
            --arg tag "$TAG" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              username: "Releases",
              embeds: [{
                title: ("Lampas Launcher " + $tag + " submitted to Microsoft Store for certification"),
                url: "https://apps.microsoft.com/detail/9P9WWSV7L7RS",
                color: 3447003,
                description: "Microsoft signs the package during certification, which takes from a few hours to a few days. The Store status check posts again once this version is installable.",
                footer: { text: "Microsoft Store submission" },
                timestamp: $timestamp
              }]
            }' > "$payload"
          curl -fsS --max-time 30 -H 'Content-Type: application/json' --data "@$payload" "$DISCORD_WEBHOOK_URL"
      # Skips are not failures. The job succeeds, and the notice names the reason and the manual publish path.
      - name: Notify Discord of Store skip
        if: steps.preflight.outputs.decision == 'skip'
        continue-on-error: true
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ github.ref_name }}
          REASON: ${{ steps.preflight.outputs.reason }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "::warning title=Discord notification skipped::DISCORD_WEBHOOK_URL is not set."
            exit 0
          fi
          payload=$(mktemp)
          jq -n \
            --arg tag "$TAG" \
            --arg reason "$REASON" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              username: "Releases",
              embeds: [{
                title: ("Lampas Launcher " + $tag + ": Microsoft Store submission skipped — " + $reason + ". Run Actions → Microsoft Store Status → publish once certification finishes."),
                color: 16753920,
                description: "The GitHub release is published as usual. Nothing was sent to the Store.",
                footer: { text: "Microsoft Store submission" },
                timestamp: $timestamp
              }]
            }' > "$payload"
          curl -fsS --max-time 30 -H 'Content-Type: application/json' --data "@$payload" "$DISCORD_WEBHOOK_URL"
      - name: Summarize Store submission
        if: always()
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          DECISION: ${{ steps.preflight.outputs.decision }}
          REASON: ${{ steps.preflight.outputs.reason }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          {
            echo "## Microsoft Store submission for ${TAG}"
            echo ""
            case "$DECISION" in
              submit)
                if [ "$PUBLISH_OUTCOME" = "success" ]; then
                  echo "Submitted for certification."
                else
                  echo "The preflight passed, but msstore publish did not complete. See the run log."
                fi
                ;;
              skip)
                echo "Skipped: $REASON."
                echo ""
                echo "Run Actions, Microsoft Store Status, Run workflow, action publish, once certification finishes."
                ;;
              *)
                echo "The run stopped before the preflight decided. See the run log."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
